  .header { background: linear-gradient(135deg, #131826, #1a2035); border-bottom: 1px solid var(--border); padding: 36px 48px 30px; }
  .brand-tag { font-size: 11px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-size: 28px; font-weight: 700; }
  .header-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* ACCOUNT TABS */
  .account-nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); overflow-x: auto; padding: 0 32px; }
  .acc-btn { padding: 14px 20px; font-size: 13px; font-weight: 600; color: var(--muted); border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: all 0.15s; }
  .acc-btn:hover { color: var(--text); }
  .acc-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  /* PHASE TABS */
  .phase-nav { display: flex; gap: 8px; padding: 16px 48px; background: var(--bg); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .phase-btn { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--muted); transition: all 0.15s; }

  .phase-btn.active.ml  { background: var(--ml-bg);  border-color: var(--ml);  color: var(--ml); }
  .phase-btn.active.eb  { background: var(--eb-bg);  border-color: var(--eb);  color: var(--eb); }
  .phase-btn.active.fp  { background: var(--fp-bg);  border-color: var(--fp);  color: var(--fp); }
  .phase-btn.active.ew  { background: var(--ew-bg);  border-color: var(--ew);  color: var(--ew); }
  .phase-btn.active.pe  { background: var(--pe-bg);  border-color: var(--pe);  color: var(--pe); }

  /* CONTENT */
  .content { padding: 32px 48px 64px; }
  .account-header { margin-bottom: 24px; }
  .account-title { font-size: 20px; font-weight: 700; }
  .account-desc { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; max-width: 700px; }

  .phase-banner { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 10px; margin-bottom: 24px; font-size: 14px; }
  .phase-banner.std { background: var(--std-bg); border: 1px solid var(--std); }
  .phase-banner.ml  { background: var(--ml-bg);  border: 1px solid var(--ml); }
  .phase-banner.eb  { background: var(--eb-bg);  border: 1px solid var(--eb); }
  .phase-banner.fp  { background: var(--fp-bg);  border: 1px solid var(--fp); }
  .phase-banner.ew  { background: var(--ew-bg);  border: 1px solid var(--ew); }
  .phase-banner.pe  { background: var(--pe-bg);  border: 1px solid var(--pe); }

  .phase-banner.pe  .phase-banner-label { color: var(--pe); }
  .phase-banner-desc { color: var(--muted); font-size: 13px; }

  .days-grid { display: flex; flex-direction: column; gap: 12px; }
  .day-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

  .day-header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface2); }
  .day-name { font-size: 13px; font-weight: 700; min-width: 80px; }
  .day-format { font-size: 11px; background: rgba(79,142,247,0.15); color: var(--accent); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .day-body { padding: 14px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .day-field label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; display: block; }

  .rest-day { padding: 14px 20px; color: var(--muted); font-size: 13px; font-style: italic; }

  @media (max-width: 700px) {

    .account-nav { padding: 0 16px; }
    .day-body { grid-template-columns: 1fr; }
    .acc-btn { padding: 12px 14px; font-size: 12px; }
  }
</style>

let activeAcc = 'jci-yt';
let activePhase = 'std';

function render() {
  const acc = ACCOUNTS.find(a => a.id === activeAcc);
  const phase = PHASES.find(p => p.id === activePhase);
  const accData = DATA[activeAcc] || {};

  document.getElementById('mainContent').innerHTML = `
    <div class="account-header">
      <div class="account-title">${acc.label}</div>
      <div class="account-desc">${acc.desc}</div>
    </div>
    <div class="phase-banner ${phase.cls}">
      <span class="phase-banner-label">${phase.label}</span>
      <span class="phase-banner-desc">${phase.desc}</span>
    </div>
    <div class="days-grid">
      ${DAYS.map(day => {
        const cell = (accData[day] || {})[activePhase];
        if (!cell) return `<div class="day-card empty"><div class="day-header"><div class="day-name">${day}</div></div><div class="rest-day">No post scheduled this day for this phase.</div></div>`;
        return `<div class="day-card">
          <div class="day-header">
            <div class="day-name">${day}</div>
            <div class="day-format">${cell.format}</div>
          </div>
          <div class="day-body">
            <div class="day-field" style="grid-column:1/-1">
              <label>Content</label>
              <p>${cell.content}</p>
            </div>
            <div class="day-field goal">
              <label>Goal</label>
              <p>${cell.goal}</p>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

// Build account nav
const accNav = document.getElementById('accountNav');
ACCOUNTS.forEach(acc => {
  const btn = document.createElement('button');
  btn.className = 'acc-btn' + (acc.id === activeAcc ? ' active' : '');
  btn.textContent = acc.label;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.acc-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeAcc = acc.id;
    render();
  });
  accNav.appendChild(btn);
});

// Build phase nav
const phaseNav = document.getElementById('phaseNav');
PHASES.forEach(phase => {
  const btn = document.createElement('button');
  btn.className = `phase-btn${phase.id === activePhase ? ' active ' + phase.cls : ''}`;
  btn.textContent = phase.label;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.phase-btn').forEach(b => { b.classList.remove('active'); PHASES.forEach(p => b.classList.remove(p.cls)); });
    btn.classList.add('active', phase.cls);
    activePhase = phase.id;
    render();
  });
  phaseNav.appendChild(btn);
});

render();
</script>
